<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Compass — เข็มทิศค้นหาตัวตน</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%23fff' stroke='%230e2a47' stroke-width='2'/%3E%3Cpath d='M16 8 10.6 10.6 13.4 13.4z' fill='%23ff6b6b'/%3E%3Cpath d='M8 16 13.4 13.4 10.6 10.6z' fill='%234d96ff'/%3E%3C/svg%3E">
<script>
  /* ตั้งธีมก่อนวาดหน้า กันจอกะพริบ — ใช้ค่าที่ผู้ใช้เลือกไว้ ไม่งั้นเริ่มที่โหมดสว่าง */
  try{ document.documentElement.dataset.theme = localStorage.getItem('cc_theme') || 'light'; }
  catch(e){ document.documentElement.dataset.theme = 'light'; }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Mali:wght@500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,900&display=swap" rel="stylesheet">
<style>
  :root{
    --R:#ff6b6b; --I:#4d96ff; --A:#c874e8; --S:#2ec4b6; --E:#ffb703; --C:#4ec27a;
    --navy:#0e2a47; --teal:#2ec4b6; --teal-ink:#12867b; --amber:#ffb703; --coral:#ff6b6b;
    --cover:#0e2a47; --paper:#fffdf6; --rule:#e3ebf5; --margin:#ffb4b4;
    --ink:#0e2a47; --mist:#5c7290; --card:#ffffff; --line:#e4dfd2; --shadow:rgba(14,42,71,.13);
    --sel:#e6f7f4; --ic-line:#22303f; --btn-sh:#0e2a47;
    --tape:rgba(255,183,3,.5); --tape2:rgba(46,196,182,.42); --tape3:rgba(200,116,232,.38);
    --sc1:#fff0bf; --sc2:#d3f3ee;
    --bar:#2f74d0; --bar-mute:#a9b4c2;   /* กราฟ: สีเน้น / สีลดความสำคัญ — ผ่าน validate_palette.js แล้ว */
    --mx:46px; --top-h:60px;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --cover:#08121d; --paper:#18212d; --rule:#222d3b; --margin:#5b2f3a;
    --ink:#ece7dc; --mist:#9fb0c3; --card:#1f2a38; --line:#33425a; --shadow:rgba(0,0,0,.45);
    --sel:#173f3c; --teal-ink:#5fe0d3; --ic-line:#e9e4d8; --btn-sh:#000;
    --sc1:#4a3c12; --sc2:#123f3a;
    --bar:#6ea6ff; --bar-mute:#56657b;
    color-scheme:dark;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:'IBM Plex Sans Thai',sans-serif;color:var(--ink);line-height:1.6;min-height:100dvh;
    background:var(--cover) radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.2px) 0 0/18px 18px;}
  button,input{font-family:inherit;}
  :focus-visible{outline:3px solid var(--amber);outline-offset:2px;}
  [hidden]{display:none!important;}

  /* ---------- ไอคอน (วาดเอง แทนอีโมจิ) ---------- */
  .ic{width:1.35em;height:1.35em;flex-shrink:0;vertical-align:middle;fill:none;stroke:var(--ic-line);
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .ic .k{stroke:#22303f;} .ic .w{stroke:#fff;}
  .ic.lg{width:38px;height:38px;} .ic.xl{width:60px;height:60px;}

  /* ---------- แถบบน (อยู่บนปกสมุด) ---------- */
  .topbar{position:sticky;top:0;z-index:30;height:var(--top-h);max-width:1040px;margin:0 auto;padding:0 10px;
    display:flex;align-items:center;gap:6px;color:#f6f4ee;--ic-line:#f6f4ee;background:var(--cover);}
  .brand{display:flex;align-items:center;gap:8px;font:700 18px 'Mali',sans-serif;color:inherit;background:none;border:0;cursor:pointer;white-space:nowrap;}
  .brand .ic{width:28px;height:28px;}
  .spacer{flex:1;}
  .icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:inherit;
    display:grid;place-items:center;cursor:pointer;flex-shrink:0;}
  .icon-btn:hover{background:rgba(127,127,127,.16);}
  .icon-btn .ic{width:24px;height:24px;}
  .user-chip{display:flex;align-items:center;gap:6px;height:38px;padding:0 6px;border-radius:20px;
    border:1.5px solid rgba(246,244,238,.3);background:transparent;color:inherit;font-weight:600;font-size:14px;cursor:pointer;max-width:42vw;}
  .user-chip .ic{width:26px;height:26px;}
  .user-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px;}
  @media(max-width:420px){.topbar .brand span{display:none;}}

  /* ---------- เมนูขีดสามขีด ---------- */
  .scrim{position:fixed;inset:0;z-index:40;background:rgba(5,12,20,.55);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;}
  .drawer{position:fixed;top:0;bottom:0;left:0;z-index:41;width:min(290px,82vw);padding:12px;display:flex;flex-direction:column;gap:4px;
    background:var(--paper) repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);color:var(--ink);
    transform:translateX(-102%);visibility:hidden;transition:transform .3s ease,visibility .3s;box-shadow:6px 0 30px rgba(0,0,0,.3);}
  .menu-open .scrim{opacity:1;visibility:visible;}
  .menu-open .drawer{transform:none;visibility:visible;}
  .drawer-h{display:flex;align-items:center;justify-content:space-between;padding-left:6px;margin-bottom:10px;}
  .nav-item{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:12px;border:0;background:none;
    color:var(--ink);font-weight:600;font-size:16px;cursor:pointer;text-align:left;}
  .nav-item .ic{width:30px;height:30px;}
  .nav-item:hover{background:var(--sel);}
  .nav-item.on{background:var(--sel);box-shadow:inset 4px 0 0 var(--teal);}

  /* ---------- สมุด: แต่ละ section คือหนึ่งหน้ากระดาษ ---------- */
  .book{position:relative;max-width:1040px;margin:0 auto;padding:4px 10px 28px;perspective:2400px;}
  .page{display:none;} .page.active{display:block;}
  .sheet{position:relative;min-height:calc(100dvh - var(--top-h) - 32px);color:var(--ink);
    padding:28px 28px 48px calc(var(--mx) + 22px);border-radius:6px 16px 16px 6px;
    background-color:var(--paper);
    background-image:linear-gradient(90deg,transparent calc(var(--mx) - 1px),var(--margin) calc(var(--mx) - 1px),var(--margin) calc(var(--mx) + 1px),transparent calc(var(--mx) + 1px)),
      repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);
    box-shadow:0 18px 40px rgba(0,0,0,.28);}
  /* รูเจาะกระดาษด้านซ้าย */
  .sheet::before{content:"";position:absolute;left:10px;top:18px;bottom:18px;width:14px;
    background:radial-gradient(circle at 7px 7px,var(--cover) 0 5.5px,transparent 6px) 0 0/14px 32px repeat-y;}
  /* เลขหน้ามุมล่างขวา */
  .sheet::after{content:attr(data-no);position:absolute;right:20px;bottom:12px;font:600 14px 'Mali',sans-serif;color:var(--mist);}
  @media(max-width:600px){
    :root{--mx:30px;}
    .book{padding:2px 6px 16px;}
    .sheet{padding:20px 14px 44px calc(var(--mx) + 12px);}
    .sheet::before{left:6px;width:12px;background-size:12px 28px;
      background-image:radial-gradient(circle at 6px 6px,var(--cover) 0 4.5px,transparent 5px);}
  }

  /* ---------- พลิกหน้า ---------- */
  .ghost{position:absolute!important;display:block!important;margin:0!important;overflow:hidden;pointer-events:none;
    z-index:3;transform-origin:left center;backface-visibility:hidden;}
  .ghost.under{z-index:0;}
  .turn-out{animation:turnOut .45s cubic-bezier(.5,0,.75,0) forwards;}
  .turn-in{position:relative;z-index:2;transform-origin:left center;backface-visibility:hidden;
    animation:turnIn .45s cubic-bezier(.25,1,.5,1) both;}
  @keyframes turnOut{from{transform:rotateY(0);filter:brightness(1);}to{transform:rotateY(-90deg);filter:brightness(.6);}}
  @keyframes turnIn{from{transform:rotateY(-90deg);filter:brightness(.6);}to{transform:rotateY(0);filter:brightness(1);}}
  @media(prefers-reduced-motion:reduce){.turn-out,.turn-in{animation:none;}}

  /* ---------- กระดาษโน้ต ---------- */
  .grid{display:grid;gap:26px 18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));align-items:start;}
  .wide{grid-column:1/-1;}
  .note{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:20px 18px 18px;
    box-shadow:3px 4px 0 var(--shadow);}
  .taped::before{content:"";position:absolute;top:-10px;left:50%;width:72px;height:20px;border-radius:2px;
    background:var(--tape);transform:translateX(-50%) rotate(-3deg);}
  .grid>.taped:nth-child(3n+2)::before{background:var(--tape2);transform:translateX(-50%) rotate(2deg);}
  .grid>.taped:nth-child(3n)::before{background:var(--tape3);transform:translateX(-50%) rotate(-1deg);}

  .page-h,.sec-h,.note-h,.h{font-family:'Mali','IBM Plex Sans Thai',sans-serif;font-weight:700;}
  .page-h{display:flex;align-items:center;gap:10px;font-size:24px;margin-bottom:18px;}
  .page-h .ic{width:36px;height:36px;}
  .sec-h{display:flex;align-items:center;gap:10px;font-size:20px;margin:30px 0 14px;}
  .sec-h .ic{width:30px;height:30px;}
  .note-h{display:flex;align-items:center;gap:8px;font-size:17px;margin-bottom:12px;}
  .note-h .ic{width:26px;height:26px;}
  .note-h .icon-btn{margin-left:auto;margin-top:-8px;margin-right:-8px;}
  .muted{color:var(--mist);}
  .fine{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--mist);margin-top:24px;}
  .fine .ic{width:18px;height:18px;margin-top:1px;}

  /* ---------- ปุ่ม ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;
    border-radius:14px;border:2px solid transparent;background:none;color:var(--ink);font-weight:700;font-size:16px;
    cursor:pointer;transition:transform .12s,box-shadow .12s;text-decoration:none;}
  .btn .ic{width:22px;height:22px;}
  .btn-primary{background:var(--amber);color:#0e2a47;border-color:#0e2a47;box-shadow:3px 4px 0 var(--btn-sh);--ic-line:#0e2a47;}
  .btn-primary:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--btn-sh);}
  .btn-ghost{background:var(--card);border-color:var(--line);}
  .btn-danger{background:var(--coral);color:#fff;--ic-line:#fff;}
  .btn-danger-line{border-color:var(--coral);color:var(--coral);margin-top:22px;}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .icon-only{width:56px;padding:0;}
  .btn-link{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--teal-ink);
    font-weight:700;font-size:15px;cursor:pointer;padding:8px 0;--ic-line:var(--teal-ink);}
  .btn-link .ic{width:18px;height:18px;}
  .soon{position:relative;}
  .soon::after{content:"เร็วๆ นี้";position:absolute;top:-10px;right:-6px;font-size:10.5px;font-weight:700;
    background:var(--A);color:#fff;padding:1px 8px;border-radius:10px;}

  .bar{height:8px;background:var(--rule);border-radius:8px;overflow:hidden;}
  .bar>i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--teal),var(--amber));transition:width .3s;}

  /* ---------- หน้าหลัก ---------- */
  .quiz-note{display:flex;flex-direction:column;gap:14px;}
  .quiz-note .top{display:flex;align-items:center;gap:14px;}
  .quiz-note .top .ic{width:56px;height:56px;}
  .quiz-note .h{font-size:20px;line-height:1.3;}
  .quiz-note b{font-family:'Fraunces',serif;}
  .tiles{display:flex;gap:6px;justify-content:center;}
  .tile{width:42px;height:42px;border-radius:10px;color:#fff;font:900 22px 'Fraunces',serif;display:grid;place-items:center;
    box-shadow:2px 3px 0 var(--shadow);}
  .tiles.big .tile{width:60px;height:60px;font-size:32px;border-radius:14px;}
  .tiles.sm{justify-content:flex-start;gap:4px;}
  .tiles.sm .tile{width:24px;height:24px;font-size:12px;border-radius:7px;box-shadow:none;}
  .rank-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line);}
  .rank-row .ic{width:28px;height:28px;}
  .rank-row .nm{flex:1;font-size:14px;font-weight:600;line-height:1.4;}
  .rank-row b{font-family:'Fraunces',serif;color:var(--teal-ink);}
  .dims{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media(min-width:760px){.dims{grid-template-columns:repeat(6,1fr);}}
  .dim{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px 10px;border-radius:12px;
    border:1.5px solid var(--line);border-top:4px solid var(--c);background:var(--paper);text-align:center;}
  .dim .ic{width:36px;height:36px;margin-bottom:4px;}
  .dim b{font:900 18px 'Fraunces',serif;color:var(--c);line-height:1;}
  .dim small{font-size:12px;color:var(--mist);line-height:1.35;}
  .radar svg{display:block;margin:4px auto;max-width:100%;height:auto;}
  .shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-self:stretch;}
  .shortcut{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:130px;padding:14px 8px;
    border:1.5px solid var(--line);border-radius:16px;color:var(--ink);font-weight:700;font-size:16px;cursor:pointer;
    box-shadow:3px 4px 0 var(--shadow);transition:transform .15s;}
  .shortcut .ic{width:54px;height:54px;}
  .shortcut:hover{transform:translateY(-3px) rotate(0deg);}
  .sc1{background:var(--sc1);transform:rotate(-1.5deg);} .sc2{background:var(--sc2);transform:rotate(1.5deg);}
  /* ปุ่มลัด: กล่องที่ขยายจากปุ่มจนเต็มหน้ากระดาษ */
  .zoom-ov{position:fixed;z-index:50;display:grid;place-items:center;overflow:hidden;pointer-events:none;
    box-shadow:0 18px 40px rgba(0,0,0,.28);}
  .zoom-ov .ic{width:64px;height:64px;}

  /* ---------- แบบประเมิน ---------- */
  .quizbar{position:sticky;top:var(--top-h);z-index:5;display:flex;align-items:center;gap:12px;
    margin:-12px 0 20px;padding:8px 0;background:var(--paper);}
  .quizbar .bar{flex:1;}
  .q-count{font:700 15px 'Fraunces',serif;white-space:nowrap;}
  .q-dim{display:flex;gap:2px;} .q-dim .ic{width:30px;height:30px;}
  .q-host{position:relative;max-width:680px;margin:0 auto;padding:26px 0 24px;}
  .q-sheet{padding-top:34px;padding-bottom:34px;}
  #page-quiz{overflow:clip;}   /* คำถามที่หล่นออกนอกกระดาษถูกตัด ไม่ทำให้หน้ายาวขึ้น */
  /* อุปกรณ์ตกแต่งวางคร่อมขอบบน/ล่างของการ์ด — ตำแหน่งมาจาก LAYOUTS ผ่านตัวแปร --x --r ใน style */
  .prop{position:absolute;--size:54px;--off:-32px;width:var(--size);height:var(--size);
    left:var(--x);margin-left:calc(var(--size) / -2);pointer-events:none;
    transform:rotate(var(--r));filter:drop-shadow(2px 3px 0 var(--shadow));}
  .prop.t{top:var(--off);} .prop.b{bottom:var(--off);}
  .prop.tool{--size:46px;--off:-26px;}
  .prop .ic{width:100%;height:100%;}
  @media(max-width:600px){.prop{--size:44px;--off:-26px;} .prop.tool{--size:38px;--off:-21px;}}
  /* เปลี่ยนข้อ: การ์ดเก่าหล่นลงพร้อมอุปกรณ์ การ์ดใหม่ตกลงมาจากด้านบน */
  .fall-out{animation:fallOut .55s cubic-bezier(.5,0,.9,.45) forwards;overflow:visible!important;}
  .fall-out .prop{animation:propFall .55s ease-in forwards;}
  .drop-in{position:relative;z-index:2;animation:dropIn .7s cubic-bezier(.2,.8,.3,1) both;}
  .drop-in .prop{animation:propDrop .5s cubic-bezier(.2,.9,.3,1.35) var(--d) both;}
  @keyframes fallOut{to{transform:translateY(75vh) rotate(7deg);opacity:0;}}
  @keyframes propFall{to{transform:translate(var(--dx),60px) rotate(calc(var(--r) + var(--spin)));}}
  @keyframes dropIn{from{transform:translateY(-70vh) rotate(-5deg);opacity:0;}
    65%{transform:translateY(12px) rotate(1deg);opacity:1;}to{transform:none;opacity:1;}}
  @keyframes propDrop{from{transform:translateY(-60px) rotate(calc(var(--r) - 40deg));opacity:0;}to{transform:rotate(var(--r));opacity:1;}}
  @media(prefers-reduced-motion:reduce){.fall-out,.drop-in,.fall-out .prop,.drop-in .prop{animation:none;}}
  /* ---------- ตลาดแรงงาน: การ์ดละ 1 แหล่งข้อมูล ---------- */
  .stats-grid{display:grid;gap:26px 18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));align-items:start;}
  .stat-card{display:flex;flex-direction:column;gap:14px;}
  .src-tag{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;background:rgba(255,183,3,.2);color:var(--ink);}
  .src-tag.real{background:var(--sel);color:var(--teal-ink);}
  .stat-q{font:700 18px/1.4 'Mali',sans-serif;}
  .hero-fig{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .hero-fig b{font:700 46px/1 'IBM Plex Sans Thai',sans-serif;}
  .hero-fig span{color:var(--mist);font-size:14px;}
  .hbars{display:flex;flex-direction:column;}
  .hbar-row{display:grid;grid-template-columns:minmax(96px,38%) 1fr 66px;gap:10px;align-items:center;padding:5px 0;}
  .hbar-head{font-size:12px;color:var(--mist);padding-bottom:6px;margin-bottom:2px;border-bottom:1px solid var(--line);}
  .hbar-lbl{display:flex;flex-direction:column;font-size:13.5px;font-weight:600;line-height:1.3;}
  .hbar-lbl .trend{font-size:12px;font-weight:500;color:var(--mist);}
  .hbar-track{position:relative;height:18px;display:flex;align-items:center;}
  .hbar-track em{font-size:12px;font-style:normal;color:var(--mist);}
  .hbar{display:block;height:14px;border-radius:0 4px 4px 0;background:var(--bar);}
  .hbar.mute{background:var(--bar-mute);}
  .hbar-val{text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;}
  .avg-line{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink);opacity:.55;}
  .avg-key{display:flex;align-items:center;gap:6px;}
  .avg-key i{width:2px;height:12px;background:var(--ink);opacity:.55;}
  .dnotes{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px dashed var(--line);}
  .dnotes .meta b{color:var(--ink);margin-right:2px;}
  /* ---------- การ์ดคณะ: ตำแหน่งที่อุตสาหกรรมเป้าหมายต้องการ ---------- */
  .jobs{padding-top:10px;border-top:1px dashed var(--line);}
  .jobs-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;}
  .jobs-h .ic{width:22px;height:22px;}
  .jobs-h .icon-btn{margin-left:auto;width:36px;height:36px;}
  .jobs-h .icon-btn .ic{width:20px;height:20px;}
  .job{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);}
  .job:last-child{border-bottom:0;}
  .job-nm{display:flex;flex-direction:column;font-size:14px;line-height:1.35;}
  .job-nm small{font-size:11.5px;color:var(--mist);}
  .job b{white-space:nowrap;font-variant-numeric:tabular-nums;}
  .job b small{font-weight:500;color:var(--mist);}
  .jobs-empty{font-size:13px;color:var(--mist);margin-top:4px;}
  .jobs-src{display:flex;gap:6px;align-items:flex-start;margin-top:8px;font-size:12px;color:var(--mist);line-height:1.5;}
  .jobs-src .ic{width:16px;height:16px;margin-top:1px;}
  .q-text{font-size:19px;font-weight:600;line-height:1.5;margin-bottom:24px;}
  .faces{display:flex;justify-content:space-between;gap:6px;}
  .face{flex:1;max-width:76px;aspect-ratio:1;padding:0;border:0;background:none;border-radius:50%;cursor:pointer;
    display:grid;place-items:center;transition:transform .15s,opacity .15s,filter .15s;}
  .face .ic{width:100%;height:100%;}
  .face:hover{transform:scale(1.08);}
  .face.sel{transform:scale(1.16);}
  .faces.has-sel .face:not(.sel){opacity:.45;filter:grayscale(.5);}
  .face-cap{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mist);margin-top:8px;}
  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border:2px solid var(--line);
    border-radius:14px;background:var(--card);color:var(--ink);font-size:15px;line-height:1.5;cursor:pointer;transition:border-color .15s,background .15s;}
  .opt:hover{border-color:var(--teal);}
  .opt.sel{border-color:var(--teal);background:var(--sel);font-weight:600;}
  .opt .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center;}
  .opt.sel .dot{background:var(--teal);border-color:var(--teal);--ic-line:#fff;}
  .opt .dot .ic{width:16px;height:16px;stroke-width:3;}
  .nav-row{display:flex;gap:12px;max-width:680px;margin:24px auto 0;}
  .nav-row #qNext{flex:1;}

  /* ---------- ผลลัพธ์ ---------- */
  .res-hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin-bottom:28px;}
  .persona{font:600 18px 'Mali',sans-serif;}
  .score-row{display:grid;grid-template-columns:28px 18px 1fr 44px;align-items:center;gap:8px;padding:6px 0;}
  .score-row .ic{width:28px;height:28px;}
  .score-row .d{font:900 15px 'Fraunces',serif;}
  .score-row .v{font:700 14px 'Fraunces',serif;text-align:right;}
  .ticks{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14.5px;}
  .ticks li{display:flex;gap:10px;align-items:flex-start;}
  .ticks li::before{content:"";width:8px;height:8px;margin-top:9px;border-radius:50%;background:var(--teal);flex-shrink:0;}
  .icon-list{list-style:none;display:flex;flex-direction:column;gap:10px;text-align:left;}
  .icon-list li{display:flex;gap:10px;align-items:center;}
  .icon-list .ic{width:28px;height:28px;}
  details.note{padding:0;}
  details summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;cursor:pointer;}
  details summary::-webkit-details-marker{display:none;}
  details>:not(summary){margin:0 16px 12px;}
  details[open] summary{border-bottom:1px dashed var(--line);margin-bottom:12px;}
  .chev{transition:transform .2s;}
  details[open] .chev{transform:rotate(90deg);}
  .list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));align-items:start;}
  .track.top{border:2px solid var(--teal);}
  .track .nm,.fac .nm{font-weight:700;font-size:15.5px;line-height:1.35;}
  .track .nm{flex:1;}
  .pct{font:700 16px 'Fraunces',serif;color:var(--teal-ink);white-space:nowrap;}
  .meta{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--mist);line-height:1.6;}
  .meta .ic{width:22px;height:22px;margin-top:1px;}
  .actions{display:flex;flex-wrap:wrap;gap:14px 10px;margin-top:24px;}
  .actions .btn-primary{flex:1 1 220px;}

  /* ---------- คณะ ---------- */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .chip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:4px 14px;border-radius:22px;
    border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;}
  .chip.dim-chip{padding-left:7px;}
  .chip .ic{width:26px;height:26px;}
  .chip b{font-family:'Fraunces',serif;color:var(--c,var(--ink));}
  .chip.on{border-color:var(--c,var(--ink));box-shadow:inset 0 0 0 1.5px var(--c,var(--ink));background:var(--sel);}
  .chip.static{cursor:default;border-style:dashed;padding-left:7px;}
  .banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .banner>span{flex:1;min-width:170px;font-weight:600;}
  .warn{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin-bottom:16px;border-radius:12px;
    background:rgba(255,183,3,.13);border:1.5px dashed var(--amber);font-size:13.5px;line-height:1.6;}
  .warn .ic{width:24px;height:24px;}
  .warn a{color:var(--teal-ink);font-weight:700;}
  .count{font-size:13px;color:var(--mist);font-weight:600;margin-bottom:10px;}
  .fac-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .match{display:flex;align-items:center;gap:8px;}
  .match .bar{flex:1;max-width:220px;}
  .match b{font:700 14px 'Fraunces',serif;color:var(--teal-ink);}
  .star-btn{width:44px;height:44px;border:0;background:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex-shrink:0;}
  .star-btn .ic{width:28px;height:28px;}
  .star-btn:hover{background:var(--sel);}

  /* ---------- ข้อมูลของฉัน ---------- */
  .form{max-width:520px;display:flex;flex-direction:column;gap:20px;}
  .field{display:flex;flex-direction:column;gap:8px;}
  .lbl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;}
  .lbl .ic{width:26px;height:26px;}
  .field input{width:100%;font-size:16px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;
    background:var(--paper);color:var(--ink);outline:none;}
  .field input:focus{border-color:var(--teal);}
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;min-height:48px;border:2px solid var(--line);border-radius:12px;background:var(--paper);
    color:var(--ink);font-weight:700;font-size:16px;cursor:pointer;}
  .seg button.on{border-color:var(--teal);background:var(--sel);color:var(--teal-ink);}
  .form .fine{margin-top:0;}
  .opt-hint{font-size:12px;color:var(--mist);margin-top:-3px;}

  /* ---------- modal ---------- */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(5,12,20,.6);display:none;place-items:center;padding:20px;}
  .modal.show{display:grid;}
  .modal-card{width:100%;max-width:400px;text-align:center;padding:28px 22px 22px;}
  .modal-ic .ic{width:60px;height:60px;display:block;margin:0 auto 10px;}
  .modal-card h3{font:700 20px 'Mali',sans-serif;margin-bottom:8px;}
  #modalBody{font-size:14.5px;color:var(--mist);line-height:1.65;margin-bottom:20px;}
  #modalBody .cite{font-size:12px;margin-top:12px;}
  .modal-actions{display:none;gap:10px;}
  .modal-actions .btn{flex:1;}
</style>
</head>
<body>

</nav>

<main class="book" id="pages">

<section class="page sheet" id="page-dash" data-no="1">

    <div class="note taped" id="dashResult" hidden></div>
    <div class="note taped" id="dashBookmarks" hidden>
      <div class="note-h" data-ic="star"><span>บันทึกไว้</span></div>

</section>

<section class="page sheet" id="page-quiz" data-no="2">

     นำเสนอตาม CLAUDE.md กฎข้อ 2 และ 7 (แยกแหล่ง/จุดประสงค์ อธิบายให้นักเรียนเข้าใจ) ===== -->

<script>
/* ============================================================================

function toggleMenu(open){

  document.getElementById('menuBtn').setAttribute('aria-expanded', open);
  if(open) document.querySelector('#drawer .nav-item.on, #drawer .nav-item').focus();
}

function goPage(name, animate=true){
  closeMenu();
  RENDER[name]();                       // วาดหน้าใหม่ก่อนพลิก ให้พร้อมตั้งแต่เฟรมแรก
  if(name===curPage) return;
  const from = curPage && document.getElementById('page-'+curPage);
  const to = document.getElementById('page-'+name);
  const dir = ORDER.indexOf(name) > ORDER.indexOf(curPage) ? 1 : -1;
  window.scrollTo({top:0, behavior:'instant'});
  turnPage(animate ? from : null, dir, ()=>{
    if(from) from.classList.remove('active');
    to.classList.add('active');
    return to;
  });
  curPage = name;
  document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('on', b.dataset.go===name));
}

const reduceMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

/* เปลี่ยนเนื้อหาพร้อมแอนิเมชัน: โคลนของเก่าเป็นภาพนิ่ง (ghost) แล้วสลับเนื้อหาจริงข้างใต้
   mode 'turn' (เปลี่ยนหน้า): dir>0 = หน้าเก่าพลิกออกไปทางซ้าย, dir<0 = หน้าใหม่พลิกกลับเข้ามาทับ
   mode 'drop' (เปลี่ยนข้อ): ของเก่าหล่นลง ของใหม่ตกลงมาจากด้านบน — เหมือนกันทั้งสองทิศ
   swap() เปลี่ยน DOM จริงแล้วคืน element ที่จะแสดง */
function turnPage(el, dir, swap, mode='turn'){
  if(!el || reduceMotion()){ swap(); return; }
  const drop = mode==='drop';
  const ghost = el.cloneNode(true);
  ghost.removeAttribute('id');
  ghost.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
  ghost.setAttribute('aria-hidden','true');
  Object.assign(ghost.style, {top:el.offsetTop+'px', left:el.offsetLeft+'px', width:el.offsetWidth+'px',
    height:(drop ? el.offsetHeight : Math.min(el.offsetHeight, window.innerHeight))+'px'});
  ghost.classList.add('ghost', drop ? 'fall-out' : dir>0 ? 'turn-out' : 'under');
  const shown = swap();
  el.parentNode.appendChild(ghost);
  const inCls = drop ? 'drop-in' : (dir<0 ? 'turn-in' : null);
  if(inCls) shown.classList.add(inCls);
  const watch = inCls ? shown : ghost;
  let done = false;
  const end = ()=>{ if(done) return; done = true; ghost.remove(); if(inCls) shown.classList.remove(inCls); };
  // animationend ของอุปกรณ์ตกแต่ง (ลูก) bubble ขึ้นมาด้วย → ฟังเฉพาะของตัวมันเอง
  watch.addEventListener('animationend', e=>{ if(e.target===watch) end(); });
  setTimeout(end, 900);   // กันกรณี animationend ไม่ยิง (แท็บถูกซ่อน ฯลฯ)
}

/* ปุ่มลัดหน้าหลัก: ซูมเข้าไปในปุ่ม — กล่องสีของปุ่มขยายจนเต็มหน้ากระดาษ แล้วกลายเป็นหน้าใหม่ */
function zoomTo(name, btn){
  if(reduceMotion() || !btn.animate){ goPage(name); return; }
  window.scrollTo({top:0, behavior:'instant'});
  const r = btn.getBoundingClientRect();
  const s = document.querySelector('.page.active').getBoundingClientRect();
  const ov = document.createElement('div');
  ov.className = 'zoom-ov';
  ov.innerHTML = ic(btn.dataset.ic);
  document.body.appendChild(ov);
  const paper = getComputedStyle(document.documentElement).getPropertyValue('--paper').trim();
  const box = (x,y,w,h,rad,bg)=>({left:x+'px', top:y+'px', width:w+'px', height:h+'px', borderRadius:rad, backgroundColor:bg});
  const grow = ov.animate([
    box(r.left, r.top, r.width, r.height, '16px', getComputedStyle(btn).backgroundColor),
    box(s.left, s.top, s.width, Math.min(s.height, window.innerHeight - s.top), '6px 16px 16px 6px', paper),
  ], {duration:480, easing:'cubic-bezier(.65,0,.25,1)', fill:'forwards'});
  ov.firstChild.animate([{transform:'scale(1)', opacity:1}, {transform:'scale(2.6)', opacity:0}],
    {duration:480, easing:'ease-in', fill:'forwards'});
  grow.onfinish = ()=>{
    goPage(name, false);
    ov.animate([{opacity:1},{opacity:0}], {duration:240, fill:'forwards'}).onfinish = ()=> ov.remove();
  };
}

let deco = {q:-1};
function renderProps(q){
  if(deco.q !== qIdx){
    // ponytail: สลับด้วย sort(random) เอนเอียงเล็กน้อย พอสำหรับของตกแต่ง
    deco = {q:qIdx, layout:LAYOUTS[Math.floor(Math.random()*LAYOUTS.length)],
      tools:[...STATIONERY].sort(()=>Math.random()-.5).slice(0,3)};
  }
  return [...(PROPS[q.id]||[]), ...deco.tools].map((name,i)=>{
    const [edge,x,r] = deco.layout[i], left = x<50;
    return `<span class="prop ${edge} ${i<2?'job':'tool'}" style="--x:${x}%;--r:${r}deg;--dx:${left?-40:40}px;--spin:${left?-80:90}deg;--d:${(.04+i*.03).toFixed(2)}s">${ic(name)}</span>`;
  }).join('');
}

function answerLikert(v){ answers[QUESTIONS[qIdx].id]=v; renderQ(); }
function answerChoice(i){ answers[QUESTIONS[qIdx].id]=i; renderQ(); }

/* ============================================================================
   SCORING ENGINE — ตามสูตรในเอกสารต้นฉบับ
   Likert: คะแนนตรงมิติ 1-5
   Situational: primary +3, secondary +1
   Sub: ตัวเลือกที่ตรงมิติ +2
   Normalize: (Raw-Min)/(Max-Min) * 100
   ============================================================================ */
function computeMinMax(){
  const min={}, max={};
  DIMS.forEach(d=>{ min[d]=0; max[d]=0; });
  QUESTIONS.forEach(q=>{
    if(q.type==='likert'){ min[q.dim]+=1; max[q.dim]+=5; }
    else if(q.type==='situational'){
      DIMS.forEach(d=>{
        const hasP=q.options.some(o=>o.primary===d);
        const hasS=q.options.some(o=>o.secondary===d);
        if(hasP) max[d]+=3; else if(hasS) max[d]+=1;
      });
    } else if(q.type==='sub'){
      const[d1,d2]=q.pair; max[d1]+=2; max[d2]+=2;
    }
  });
  return {min,max};
}
function computeRaw(){
  const raw={}; DIMS.forEach(d=>raw[d]=0);
  QUESTIONS.forEach(q=>{
    const a=answers[q.id]; if(a===undefined) return;
    if(q.type==='likert'){ raw[q.dim]+=a; }
    else if(q.type==='situational'){ const o=q.options[a]; raw[o.primary]+=3; if(o.secondary) raw[o.secondary]+=1; }
    else if(q.type==='sub'){ const o=q.options[a]; raw[o.dim]+=2; }
  });
  return raw;
}
function normalize(raw,min,max){
  const n={};
  DIMS.forEach(d=>{ const r=max[d]-min[d]; n[d]= r>0 ? Math.round((raw[d]-min[d])/r*100) : 0; });
  return n;
}

function finishQuiz(){
  const {min,max} = computeMinMax();
  const raw = computeRaw();
  const scores = normalize(raw,min,max);
  const sorted = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const hollandCode = sorted.slice(0,3).map(x=>x[0]).join('');
  lastResult = {scores, hollandCode, ts:new Date().toISOString()};
  saveResult(lastResult);
  answers={}; qIdx=0; clearProgress();
  goPage('results');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- SVG Radar ---------- */
function drawRadar(elId, scores, size){
  const cx=size/2, cy=size/2+8, rMax=size*0.36, n=6;
  const ang=i=> (Math.PI*2*i/n) - Math.PI/2;
  const pt=(i,r)=>[cx+r*Math.cos(ang(i)), cy+r*Math.sin(ang(i))];

  let grid='';
  [0.25,0.5,0.75,1].forEach(f=>{
    let p=DIMS.map((_,i)=>pt(i,rMax*f).join(',')).join(' ');
    grid+=`<polygon points="${p}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  });
  let axes='';
  DIMS.forEach((_,i)=>{ const[x,y]=pt(i,rMax); axes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`; });

  let poly=DIMS.map((d,i)=>pt(i,rMax*scores[d]/100).join(',')).join(' ');
  let dots=DIMS.map((d,i)=>{const[x,y]=pt(i,rMax*scores[d]/100);return `<circle cx="${x}" cy="${y}" r="4" fill="${DIM_INFO[d].color}"/>`;}).join('');

  let labels='';
  DIMS.forEach((d,i)=>{
    const[x,y]=pt(i,rMax+20);
    labels+=`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle"
      font-size="14" font-weight="700" fill="${DIM_INFO[d].color}">${d}</text>`;
  });

  document.getElementById(elId).innerHTML =
    `<svg viewBox="0 0 ${size} ${size+16}" width="${size}">${grid}${axes}
      <polygon points="${poly}" fill="rgba(46,196,182,.25)" stroke="#2ec4b6" stroke-width="2.5"/>
      ${dots}${labels}</svg>`;
}

function matchFaculties(scores){
  return FACULTIES.map(f=>{
    // จับคู่ตามคะแนนเฉลี่ยของมิติที่ประกอบเป็นรหัสคณะ (ถ่วงน้ำหนักตามลำดับ)
    const weights=[1,0.7,0.5];
    let sum=0, wsum=0;
    f.code.forEach((d,i)=>{ const w=weights[i]||0.3; sum+= scores[d]*w; wsum+=w; });
    const match = Math.round(sum/wsum);
    return {...f, match};
  }).sort((a,b)=>b.match-a.match);
}

/* จับคู่สายการเรียน ใช้หลักการถ่วงน้ำหนักเดียวกับการจับคู่คณะ */
function matchTracks(scores){
  return TRACKS.map(t=>{
    const weights=[1,0.7,0.5];
    let sum=0, wsum=0;
    t.code.forEach((d,i)=>{ const w=weights[i]||0.3; sum+= scores[d]*w; wsum+=w; });
    return {...t, match: Math.round(sum/wsum)};
  }).sort((a,b)=>b.match-a.match);
}

  const src = `<p class="jobs-src">${ic('book')}<span>ที่มา: สอวช. — การสำรวจความต้องการบุคลากรทักษะสูงในอุตสาหกรรมเป้าหมาย พ.ศ. 2568–2572</span></p>`;
  if(!jobs.length) return `<div class="jobs">${head}<p class="jobs-empty">ไม่มีตำแหน่งของคณะนี้ในรายงาน — รายงานสำรวจเฉพาะ 10 อุตสาหกรรมเป้าหมาย ไม่ได้แปลว่าไม่มีงาน</p>${src}</div>`;
  return `<div class="jobs">${head}${jobs.map(([th,en,ind,n])=>`
    <div class="job" title="${en} · อุตสาหกรรม${ind}">
      <span class="job-nm">${th}<small>${ind}</small></span>
      <b>${n.toLocaleString('th-TH')}<small> คน</small></b>
    </div>`).join('')}${src}</div>`;
}
function showJobsInfo(){
  openModal('target','อุตสาหกรรมเป้าหมายต้องการ', `
    <ul class="icon-list">
      <li>${ic('spark')}<span><b>หมายความว่า</b> จำนวนคนที่บริษัทคาดว่าต้องการในตำแหน่งนี้ รวม 5 ปี (2568–2572)</span></li>
      <li>${ic('globe')}<span><b>ครอบคลุม</b> เฉพาะ 10 อุตสาหกรรมที่ประเทศไทยตั้งใจผลักดัน เช่น ดิจิทัล การแพทย์ ยานยนต์สมัยใหม่ — ไม่ใช่งานทั้งหมดในประเทศ</span></li>
      <li>${ic('warn')}<span><b>ข้อควรรู้</b> ตัวเลขน้อยหรือไม่มี ไม่ได้แปลว่าอาชีพนั้นไม่มีงาน · เป็นการสำรวจความต้องการ ไม่ใช่ตำแหน่งที่เปิดรับจริง · การจับคู่คณะกับตำแหน่งทำโดยทีมผู้พัฒนา</span></li>
      <li>${ic('book')}<span><b>ที่มา</b> สอวช. การสำรวจความต้องการบุคลากรทักษะสูงในอุตสาหกรรมเป้าหมาย พ.ศ. 2568–2572 (สำรวจองค์กร 300+ แห่ง)</span></li>
    </ul>`);
}

/* เอาเมาส์ชี้การ์ดคณะ = เปิดดูข้อมูล, เอาออก = ปิด — เฉพาะเครื่องที่มีเมาส์
   (จอสัมผัสจำลอง mouseenter ตอนแตะ จะชนกับการกดเปิด/ปิด จึงใช้การกดแบบเดิม)
   กดการ์ด = ปักไว้ให้เปิดค้างแม้เอาเมาส์ออก, กดอีกครั้ง = เลิกปักและปิด */
const canHover = () => !!(window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches);
function hoverOpen(d){
  let t;
  // หน่วง 150ms: ลากเมาส์ผ่านเร็วๆ การ์ดจะไม่เด้งเปิดทีละใบจนหน้ากระโดด
  d.addEventListener('mouseenter', ()=>{ t = setTimeout(()=>{ if(!d.dataset.pin) d.open = true; }, 150); });
  d.addEventListener('mouseleave', ()=>{ clearTimeout(t); if(!d.dataset.pin) d.open = false; });
  d.querySelector('summary').addEventListener('click', e=>{
    e.preventDefault();
    if(d.dataset.pin){ delete d.dataset.pin; d.open = false; }
    else { d.dataset.pin = '1'; d.open = true; }
  });
}

/* ดาวอยู่ใน <summary> → กันไม่ให้การกดดาวไปเปิด/ปิดการ์ด และอัปเดตเฉพาะปุ่ม ไม่วาดรายการใหม่ */
function toggleBookmark(e, btn){
  e.preventDefault(); e.stopPropagation();
  const name = btn.dataset.name;
  let bm = loadBookmarks();
  const on = !bm.includes(name);
  bm = on ? [...bm, name] : bm.filter(x=>x!==name);
  saveBookmarks(bm);
  btn.innerHTML = ic(on ? 'star' : 'star-o');
  btn.setAttribute('aria-pressed', on);
  renderBookmarksWidget();
}

/* ============================================================================
   MODAL
   ============================================================================ */
function openModal(icon,title,body){
  document.getElementById('modalIc').innerHTML=ic(icon);
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=body;
  document.getElementById('modalOk').style.display='';
  document.getElementById('modalActions').style.display='none';
  document.getElementById('modal').classList.add('show');
}

/* กล่องยืนยันในแอป — ไม่ใช้ confirm() ของเบราว์เซอร์
   เพราะบางเบราว์เซอร์/แอปดูไฟล์บนมือถือบล็อก confirm() ทำให้ปุ่มกดแล้วไม่ทำงาน */
function openConfirm(icon,title,body,confirmText,onConfirm){
  document.getElementById('modalIc').innerHTML=ic(icon);
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=body;
  document.getElementById('modalOk').style.display='none';
  const actions = document.getElementById('modalActions');
  actions.style.display='flex';
  const btn = document.getElementById('modalConfirm');
  btn.textContent = confirmText || 'ยืนยัน';
  btn.onclick = function(){ closeModal(); onConfirm(); };
  document.getElementById('modal').classList.add('show');
}

function closeModal(){
  document.getElementById('modal').classList.remove('show');
  document.getElementById('modalOk').style.display='';
  document.getElementById('modalActions').style.display='none';
}

/* ============================================================================
   INIT — เข้าเว็บแล้วไปหน้าหลักทันที ไม่ต้องล็อกอิน
   ============================================================================ */
(function init(){
  document.querySelectorAll('[data-ic]').forEach(el=>el.insertAdjacentHTML('afterbegin', ic(el.dataset.ic)));
  user = loadUser();
  delete user.guest; if(user.grade==='-') delete user.grade;   // ข้อมูลจากเวอร์ชันเก่าที่มีโหมด Guest
  lastResult = loadResult();
  const p = loadProgress();
  if(p && p.answers){
    answers = p.answers;
    qIdx = Math.min(Math.max(0, p.qIdx|0), QUESTIONS.length-1);
  }
  renderThemeBtn(); renderUserChip(); renderRiasec();
  goPage('dash');
})();
</script>
